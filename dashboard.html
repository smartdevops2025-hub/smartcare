<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f0f4f8;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0b3b4f 0%, #0f4a5e 100%);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 12px rgba(0,0,0,0.08);
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 101;
            background: #0b3b4f;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.5rem 0.8rem;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .sidebar-header {
            padding: 1.5rem 1.2rem;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .sidebar-header h2 { font-size: 1.5rem; font-weight: 700; }
        .sidebar-header p { font-size: 0.65rem; opacity: 0.7; margin-top: 0.3rem; }

        .user-info {
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.08);
            margin: 0.8rem;
            border-radius: 0.8rem;
        }

        .user-name { font-weight: 600; font-size: 0.85rem; }
        .user-role { font-size: 0.65rem; opacity: 0.7; margin-top: 0.2rem; }

        .privilege-indicator {
            margin-top: 0.6rem;
            padding: 0.4rem;
            border-radius: 0.6rem;
            text-align: center;
            font-size: 0.65rem;
            font-weight: 600;
        }
        .privilege-l1 { background: #3b82f6; color: white; }
        .privilege-l2 { background: #10b981; color: white; }
        .privilege-l3 { background: #8b5cf6; color: white; }
        .privilege-admin { background: #ef4444; color: white; }
        .privilege-manager { background: #8b5cf6; color: white; }
        .privilege-supervisor { background: #f59e0b; color: white; }

        .nav-menu {
            flex: 1;
            padding: 0.5rem 0;
        }

        .nav-item {
            padding: 0.6rem 1rem;
            margin: 0.1rem 0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            color: #e0f2fe;
        }

        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active {
            background: rgba(255,255,255,0.2);
            border-left: 3px solid #7ab7c7;
            font-weight: 500;
        }

        .nav-icon { font-size: 1.1rem; width: 24px; }

        .logout-btn {
            margin: 0.8rem;
            padding: 0.6rem;
            background: rgba(220,80,80,0.2);
            border: 1px solid rgba(220,80,80,0.4);
            border-radius: 0.6rem;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .logout-btn:hover { background: rgba(220,80,80,0.4); }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            transition: margin-left 0.3s ease;
        }

        .page-header { margin-bottom: 1.5rem; }
        .page-title { font-size: 1.5rem; font-weight: 600; color: #0c4e6e; }
        .page-desc { color: #4b5563; font-size: 0.8rem; margin-top: 0.2rem; }

        .dashboard-widgets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .widget {
            background: white;
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .widget:hover { transform: translateY(-2px); }
        .widget-title { font-size: 0.7rem; color: #6b7280; text-transform: uppercase; }
        .widget-value { font-size: 1.8rem; font-weight: 700; color: #0c4e6e; margin: 0.3rem 0; }
        .widget-icon { float: right; font-size: 2rem; opacity: 0.3; }

        .card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .tracker-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow-x: auto;
            padding: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        th {
            text-align: left;
            padding: 0.8rem 0.5rem;
            background: #f1f5f9;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 0.8rem 0.5rem;
            border-bottom: 1px solid #eef2f6;
        }

        .status-completed { background: #dcfce7; color: #15803d; padding: 0.2rem 0.5rem; border-radius: 20px; font-size: 0.7rem; display: inline-block; }
        .status-pending { background: #fff3e3; color: #b45309; padding: 0.2rem 0.5rem; border-radius: 20px; font-size: 0.7rem; display: inline-block; }
        .status-inprogress { background: #fef9c3; color: #854d0e; padding: 0.2rem 0.5rem; border-radius: 20px; font-size: 0.7rem; display: inline-block; }

        .filter-bar {
            margin-bottom: 1rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar input, .filter-bar select {
            padding: 0.4rem 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 2rem;
            font-size: 0.75rem;
        }

        .btn-small, .quiz-btn, .update-btn, .add-btn, .edit-btn, .delete-btn, .save-btn, .export-btn, .promote-btn {
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 1.5rem;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .btn-small { background: #0f5b63; }
        .quiz-btn { background: #0f5b63; }
        .update-btn { background: #f59e0b; }
        .add-btn { background: #10b981; }
        .edit-btn { background: #3b82f6; }
        .delete-btn { background: #ef4444; }
        .save-btn { background: #8b5cf6; }
        .export-btn { background: #6b7280; }
        .promote-btn { background: #8b5cf6; }

        .role-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .role-admin { background: #ef4444; color: white; }
        .role-manager { background: #8b5cf6; color: white; }
        .role-supervisor { background: #f59e0b; color: white; }
        .role-nurse { background: #3b82f6; color: white; }

        .quiz-question {

            padding: 0.8rem;
            margin-bottom: 0.8rem;
            border-radius: 0.6rem;
        }

        .quiz-option { margin: 0.2rem 0 0.2rem 0.8rem; display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; }
        .quiz-option input { width: auto; }
        .score-display {

            font-weight: 700;
            padding: 0.8rem;
            background: #e0f2fe;
            border-radius: 0.8rem;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1rem;
        }
        .stat-card {
            background: white;
            padding: 1rem;
            border-radius: 0.8rem;
            text-align: center;
        }
        .stat-number { font-size: 1.6rem; font-weight: 700; color: #0c4e6e; }
        .stat-label { font-size: 0.7rem; color: #6b7280; }

        .chart-container { max-width: 300px; margin: 0 auto; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 450px;
        }
        .modal-content h3 { margin-bottom: 0.8rem; color: #0c4e6e; font-size: 1.2rem; }
        .modal-content select {
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.6rem;
        }
        .modal-buttons { display: flex; gap: 0.8rem; justify-content: flex-end; }

        .audit-log-entry {
            padding: 0.4rem;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.75rem;
        }

        .module-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
        }
        .module-chip {
            background: #e2e8f0;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;

        .module-chip.completed {
            background: #10b981;
            color: white;
        }
        .module-chip:hover {
            transform: scale(1.02);
        }

        .category-group {
            margin-bottom: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .category-header {
            background: #f1f5f9;
            padding: 0.5rem 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }
        .category-content {
            padding: 0.5rem;
            display: none;
        }
        .category-content.open {
            display: block;
        }

            border-radius: 0.8rem;
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .training-card-header {
            background: #f8fafc;
            padding: 0.8rem 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;

        .training-card-header:hover {
            background: #f1f5f9;
        }
        .training-card-header h4 {
            font-size: 0.9rem;
            margin: 0;
        }
        .training-progress {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .progress-bar-container {
            width: 150px;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #10b981;
            border-radius: 10px;
            transition: width 0.3s;
        }
        .expand-icon {
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        .expand-icon.expanded {
            transform: rotate(180deg);
        }
        .training-card-body {
            display: none;
            padding: 1rem;
            border-top: 1px solid #e2e8f0;
            max-height: 500px;
            overflow-y: auto;
        }
        .training-card-body.expanded {
            display: block;
        }

        @media (max-width: 768px) {

                left: -280px;
                top: 0;
                height: 100%;

                z-index: 200;
            }
            .sidebar.open { left: 0; }
            .sidebar-toggle { display: block; }
            .main-content { padding: 0.8rem; margin-top: 3rem; }
            .dashboard-widgets { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
            .widget-value { font-size: 1.3rem; }
            .page-title { font-size: 1.2rem; }
            .training-progress { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }

        @media (max-width: 480px) {
            .dashboard-widgets { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

            <option value="supervisor">👩‍🏫 Supervisor</option>
            <option value="manager">👔 Nurse Manager</option>
        </select>
        <div class="modal-buttons">
            <button class="btn-small" onclick="closeRoleModal()">Cancel</button>
            <button class="promote-btn" onclick="confirmRoleChange()">Confirm Change</button>
        </div>
    </div>
</div>

<script>
    // ========== MOBILE SIDEBAR ==========
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }
    function closeSidebar() {
        if (window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.remove('open');
        }
    }

    // ========== AUDIT LOG ==========
    let auditLog = [];
    function addAuditLog(action, details) {
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        auditLog.unshift({ 
            timestamp: new Date().toISOString(), 
            user: currentUser?.name || "Unknown", 
            userId: currentUser?.id || "Unknown", 
            role: currentUser?.role || "Unknown", 
            action, 
            details 
        });
        if(auditLog.length > 1000) auditLog.pop();
        localStorage.setItem('smartcare_audit', JSON.stringify(auditLog));
    }
    const savedAudit = localStorage.getItem('smartcare_audit');
    if(savedAudit) auditLog = JSON.parse(savedAudit);

    // ========== USER SESSION ==========

    // ========== Generate Quiz Questions ==========
    function generateQuizQuestions(department, count = 20) {
        const deptModules = trainingModulesByDept[department];
        if (!deptModules) return [];
        
        let allItems = [];
        for (const [category, items] of Object.entries(deptModules)) {
            items.forEach(item => {
                allItems.push({
                    category: category,
                    text: item,
                    correctAnswer: item.includes("protocol") || item.includes("policy") ? "Follow established protocol" :
                                  item.includes("identify") ? "Verify patient identification" :
                                  item.includes("safety") ? "Ensure patient safety measures" :
                                  item.includes("document") ? "Complete documentation accurately" :
                                  item.includes("care") ? "Provide appropriate patient care" :
                                  "Demonstrate competency in " + item.toLowerCase()
                });
            });
        }
        
        const shuffled = [...allItems];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        
        return shuffled.slice(0, count).map((item, idx) => ({
            id: idx,
            text: `Regarding "${item.text}": What is the correct nursing action?`,
            category: item.category,
            options: [
                item.correctAnswer,
                "Ignore unless specifically instructed",
                "Delegate to another staff member",
                "Document without action"
            ],
            correct: 0
        }));
    }

            };
            localStorage.setItem('smartcare_quizzes', JSON.stringify(nurseQuizzes));
        }
        return nurseQuizzes[key];
    }

    function getAllModulesCount(department) {
        const deptModules = trainingModulesByDept[department];
        if (!deptModules) return { total: 0, categories: [] };
        let total = 0;
        let categories = [];
        for (const [cat, items] of Object.entries(deptModules)) {
            categories.push({ name: cat, count: items.length, items: items });
            total += items.length;
        }
        return { total, categories };
    }

    // ========== COMPETENCY ENGINE ==========
    function recalculatePrivilege(nurse) {
        if (!systemConfig.autoAssignPrivilege || nurse.role !== 'nurse') return nurse.privilege;
        let newPrivilege = nurse.privilege;
        const modules = getAllModulesCount(nurse.department);
        const completedCount = nurse.trainingModulesCompleted?.length || 0;
        const allModulesCompleted = completedCount === modules.total;
        const lastActivity = new Date(nurse.lastActivity || nurse.joiningDate);
        const daysInactive = Math.floor((new Date() - lastActivity) / (1000 * 60 * 60 * 24));
        
        if (daysInactive > systemConfig.inactivityDaysThreshold && newPrivilege > 1) newPrivilege--;
        if (nurse.quizScore) {
            if (nurse.quizScore >= systemConfig.privilegeUpgradeScore && newPrivilege < 3) newPrivilege++;
            else if (nurse.quizScore < systemConfig.privilegeDowngradeScore && newPrivilege > 1) newPrivilege--;
        }
        if (allModulesCompleted && newPrivilege < 2) newPrivilege = 2;
        return Math.min(3, Math.max(1, newPrivilege));
    }
    
    function updateAllPrivileges() {
        let changes = 0;
        nursesData.forEach(nurse => {
            const oldPrivilege = nurse.privilege;
            const newPrivilege = recalculatePrivilege(nurse);
            if (oldPrivilege !== newPrivilege) { nurse.privilege = newPrivilege; changes++; }
            const modules = getAllModulesCount(nurse.department);
            const completedCount = nurse.trainingModulesCompleted?.length || 0;
            if (completedCount === modules.total && nurse.trainingStatus !== 'Completed') nurse.trainingStatus = 'Completed';
            else if (completedCount > 0 && nurse.trainingStatus === 'Pending') nurse.trainingStatus = 'In Progress';
        });
        updateLoginUsers();
        return changes;
    }

    function toggleModuleCompletion(empId, moduleName, event) {
        event.stopPropagation();
        if (currentUser.role !== 'admin' && currentUser.role !== 'manager' && currentUser.role !== 'supervisor') {
            alert("Only Admin, Nurse Manager, and Supervisors can update training status.");
            return;
        }
        const nurse = nursesData.find(n => n.empId === empId);
        if(nurse) {
            if(!nurse.trainingModulesCompleted) nurse.trainingModulesCompleted = [];
            const index = nurse.trainingModulesCompleted.indexOf(moduleName);
            if(index === -1) {
                nurse.trainingModulesCompleted.push(moduleName);
                addAuditLog("MODULE_COMPLETED", `${nurse.name} completed: ${moduleName}`);
            } else {
                nurse.trainingModulesCompleted.splice(index, 1);
                addAuditLog("MODULE_UNCOMPLETED", `${nurse.name} unmarked: ${moduleName}`);
            }
            nurse.lastActivity = new Date().toISOString().split('T')[0];
            const oldPrivilege = nurse.privilege;
            const newPrivilege = recalculatePrivilege(nurse);
            if (oldPrivilege !== newPrivilege) {
                nurse.privilege = newPrivilege;
                addAuditLog("PRIVILEGE_AUTO_UPDATE", `${nurse.name} competency changed from Level ${oldPrivilege} to Level ${newPrivilege}`);
            }
            updateLoginUsers();
            renderTrainingStatusUpdater();
            if (currentUser.empId === empId) updateSidebarPrivilege();
        }
    }

            alert("Only Admin, Nurse Manager, and Supervisors can update training status.");

        if(nurse) {
            const modules = getAllModulesCount(nurse.department);
            let allItems = [];

        let deptStats = {};
        nurses.forEach(n => { if(!deptStats[n.department]) deptStats[n.department] = { total:0, completed:0 };
            deptStats[n.department].total++;
            if(n.trainingStatus === 'Completed') deptStats[n.department].completed++;
        });
        
        let html = `<div class="page-header"><h1 class="page-title">📊 Competency Dashboard</h1><p class="page-desc">Real-time training progress and privilege levels</p></div>
        <div class="dashboard-widgets">
            <div class="widget"><div class="widget-icon">👩‍⚕️</div><div class="widget-title">Total Nurses</div><div class="widget-value">${total}</div></div>
            <div class="widget"><div class="widget-icon">✅</div><div class="widget-title">Training Completed</div><div class="widget-value">${completed}</div></div>
            <div class="widget"><div class="widget-icon">🔄</div><div class="widget-title">In Progress</div><div class="widget-value">${inProgress}</div></div>
            <div class="widget"><div class="widget-icon">⭐</div><div class="widget-title">Level 1 (Trainee)</div><div class="widget-value">${level1}</div></div>
            <div class="widget"><div class="widget-icon">⭐⭐</div><div class="widget-title">Level 2 (Indep)</div><div class="widget-value">${level2}</div></div>
            <div class="widget"><div class="widget-icon">⭐⭐⭐</div><div class="widget-title">Level 3 (Preceptor)</div><div class="widget-value">${level3}</div></div>
            <div class="widget"><div class="widget-icon">📝</div><div class="widget-title">Avg Quiz Score</div><div class="widget-value">${Math.round(avgQuiz)}%</div></div>
        </div>
        <div class="stats-grid">${Object.entries(deptStats).map(([dept,data])=>`<div class="stat-card"><div class="stat-number">${Math.round(data.completed/data.total*100||0)}%</div><div class="stat-label">${dept}</div><small>${data.completed}/${data.total} nurses</small></div>`).join('')}</div>
        <div class="card"><h3>📊 Privilege Distribution</h3><div class="chart-container"><canvas id="privilegeChart"></canvas></div></div>`;
        document.getElementById('mainContent').innerHTML = html;
        setTimeout(() => { const ctx = document.getElementById('privilegeChart')?.getContext('2d'); if(ctx) new Chart(ctx, { type: 'doughnut', data: { labels: ['Level 1 (Trainee)', 'Level 2 (Independent)', 'Level 3 (Preceptor)'], datasets: [{ data: [level1, level2, level3], backgroundColor: ['#3b82f6', '#10b981', '#8b5cf6'] }] } }); }, 100);
        closeSidebar();
    }

    // ========== TRACKER ==========
    function renderTrackerSheet() {
        let html = `<div class="page-header"><h1 class="page-title">📋 Nurse Competency Tracker</h1><p class="page-desc">Track all nurses' training progress and competency levels</p></div>
        <div class="filter-bar">
            <input type="text" id="searchName" placeholder="🔍 Search" onkeyup="renderTrackerSheet()">
            <select id="filterDept" onchange="renderTrackerSheet()">
                <option value="all">All Departments</option>
                <option value="Labour Room">Labour Room</option>
                <option value="Emergency Department">Emergency Dept</option>
                <option value="ICU">ICU</option>
                <option value="Infection Control">Infection Control</option>
                <option value="Critical Care">Critical Care</option>
                <option value="Ward">Ward</option>
            </select>
            <select id="filterPrivilege" onchange="renderTrackerSheet()">
                <option value="all">All Privileges</option>
                <option value="1">Level 1 (Trainee)</option>
                <option value="2">Level 2 (Independent)</option>
                <option value="3">Level 3 (Preceptor)</option>
            </select>
        </div>
        <div class="tracker-card">
            <table>
                <thead>
                    <tr>
                        <th>Emp ID</th><th>Name</th><th>Department</th><th>Quiz %</th><th>Modules Done</th><th>Total Modules</th><th>Progress</th><th>Status</th><th>Competency</th>
                    </tr>
                </thead>
                <tbody>`;
        
        const filterDept = document.getElementById('filterDept')?.value || 'all';
        const filterPriv = document.getElementById('filterPrivilege')?.value || 'all';
        const search = document.getElementById('searchName')?.value.toLowerCase() || '';
        
        nursesData.filter(n => n.role === 'nurse').filter(n => 
            (filterDept === 'all' || n.department === filterDept) && 
            (filterPriv === 'all' || n.privilege == filterPriv) && 
            (n.name.toLowerCase().includes(search) || n.empId.toLowerCase().includes(search))
        ).forEach(n => {
            const modules = getAllModulesCount(n.department);
            const modulesDone = n.trainingModulesCompleted?.length || 0;
            const percent = Math.round((modulesDone/modules.total)*100);
            let statusBadge = n.trainingStatus === 'Completed' ? '<span class="status-completed">✓ Completed</span>' : (n.trainingStatus === 'In Progress' ? '<span class="status-inprogress">🔄 In Progress</span>' : '<span class="status-pending">⏳ Pending</span>');
            html += `<tr>
                <td>${n.empId}</td>
                <td><strong>${n.name}</strong></td>
                <td>${n.department}</td>
                <td>${n.quizScore || '—'}%</td>
                <td>${modulesDone}</td>
                <td>${modules.total}</td>
                <td><div style="background:#e2e8f0; border-radius:10px; width:100px;"><div style="background:#10b981; width:${percent}%; height:8px; border-radius:10px;"></div></div>${percent}%</td>
                <td>${statusBadge}</td>
                <td>${n.privilege === 1 ? '⭐ L1 Trainee' : (n.privilege === 2 ? '⭐⭐ L2 Independent' : '⭐⭐⭐ L3 Preceptor')}</td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
        document.getElementById('mainContent').innerHTML = html;
        closeSidebar();
    }

    // ========== REPORTS ==========
    function renderReports() {
        let html = `<div class="page-header"><h1 class="page-title">📑 Reports & Analytics</h1><p class="page-desc">Export competency data and view analytics</p></div>
        <div class="filter-bar">
            <button class="export-btn" onclick="exportToCSV()">📎 Export to CSV</button>
            <button class="export-btn" onclick="exportToPDFReport()">📄 Export to PDF</button>
        </div>
        <div class="tracker-card">
            <table>
                <thead><tr><th>Emp ID</th><th>Name</th><th>Dept</th><th>Quiz%</th><th>Modules</th><th>Progress</th><th>Status</th><th>Competency</th></tr></thead>
                <tbody>`;
        nursesData.filter(n => n.role === 'nurse').forEach(n => {
            const modules = getAllModulesCount(n.department);
            const modulesDone = n.trainingModulesCompleted?.length || 0;
            const percent = Math.round((modulesDone/modules.total)*100);
            html += `<tr><td>${n.empId}</td><td>${n.name}</td><td>${n.department}</td><td>${n.quizScore || '—'}%</td><td>${modulesDone}/${modules.total}</td><td>${percent}%</td><td>${n.trainingStatus}</td><td>${n.privilege === 1 ? 'L1' : (n.privilege === 2 ? 'L2' : 'L3')}</td></tr>`;
        });
        html += `</tbody></table></div>`;
        document.getElementById('mainContent').innerHTML = html;
        closeSidebar();
    }

    function exportToCSV() {
        let csv = "Emp ID,Name,Department,Quiz Score,Modules Completed,Total Modules,Progress %,Training Status,Competency Level\n";
        nursesData.filter(n => n.role === 'nurse').forEach(n => {
            const modules = getAllModulesCount(n.department);
            const modulesDone = n.trainingModulesCompleted?.length || 0;
            const percent = Math.round((modulesDone/modules.total)*100);
            csv += `"${n.empId}","${n.name}","${n.department}","${n.quizScore || '—'}","${modulesDone}","${modules.total}","${percent}","${n.trainingStatus}","${n.privilege === 1 ? 'Level 1 Trainee' : (n.privilege === 2 ? 'Level 2 Independent' : 'Level 3 Preceptor')}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `smartcare_competency_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        addAuditLog("EXPORT_CSV", "Exported competency report to CSV");
        alert("✅ CSV exported!");
    }

    function exportToPDFReport() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('landscape');
        const tableData = nursesData.filter(n => n.role === 'nurse').map(n => {
            const modules = getAllModulesCount(n.department);
            const modulesDone = n.trainingModulesCompleted?.length || 0;
            const percent = Math.round((modulesDone/modules.total)*100);
            return [n.empId, n.name, n.department, n.quizScore ? n.quizScore+'%' : '—', `${modulesDone}/${modules.total}`, `${percent}%`, n.trainingStatus, n.privilege === 1 ? 'L1' : (n.privilege === 2 ? 'L2' : 'L3')];
        });
        doc.autoTable({ head: [['Emp ID', 'Name', 'Dept', 'Quiz%', 'Modules', 'Progress', 'Status', 'Competency']], body: tableData, theme: 'striped', headStyles: { fillColor: [11, 59, 79] }, margin: { top: 20 } });
        doc.setFontSize(16);
        doc.text("SMARTCARE - Nurse Competency Report", 14, 15);
        doc.setFontSize(10);
        doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 25);
        doc.save(`smartcare_competency_${new Date().toISOString().split('T')[0]}.pdf`);
        addAuditLog("EXPORT_PDF", "Exported competency report to PDF");
        alert("✅ PDF exported!");
    }

    // ========== ROLE MANAGEMENT (CLEAN TABLE FORMAT) ==========
    function renderRoleManagement() {
        let html = `<div class="page-header"><h1 class="page-title">👔 Role Management</h1><p class="page-desc">Promote or demote nurses to Supervisor or Nurse Manager roles</p></div>
        <div class="filter-bar">
            <input type="text" id="searchRole" placeholder="🔍 Search by name or ID" onkeyup="renderRoleManagement()">
            <select id="filterDeptRole" onchange="renderRoleManagement()">
                <option value="all">All Departments</option>
                <option value="Labour Room">Labour Room</option>
                <option value="Emergency Department">Emergency Dept</option>
                <option value="ICU">ICU</option>
                <option value="Infection Control">Infection Control</option>
                <option value="Critical Care">Critical Care</option>
                <option value="Ward">Ward</option>
            </select>
            <select id="filterCurrentRole" onchange="renderRoleManagement()">
                <option value="all">All Roles</option>
                <option value="nurse">👩‍⚕️ Nurse</option>
                <option value="supervisor">👩‍🏫 Supervisor</option>
                <option value="manager">👔 Nurse Manager</option>
            </select>
        </div>
        <div class="tracker-card">
            <table>
                <thead>
                    <tr>
                        <th>Emp ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Current Role</th>
                        <th>Privilege Level</th>
                        <th>Training Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>`;
        
        const search = document.getElementById('searchRole')?.value.toLowerCase() || '';
        const filterDept = document.getElementById('filterDeptRole')?.value || 'all';
        const filterRole = document.getElementById('filterCurrentRole')?.value || 'all';
        
        let filtered = nursesData.filter(n => 
            n.empId !== 'ADMIN999' && 
            (filterDept === 'all' || n.department === filterDept) && 
            (filterRole === 'all' || n.role === filterRole) && 
            (n.name.toLowerCase().includes(search) || n.empId.toLowerCase().includes(search))
        );
        
        filtered.forEach(n => {
            let roleBadge = '';
            if (n.role === 'manager') roleBadge = '<span class="role-badge role-manager">👔 Nurse Manager</span>';
            else if (n.role === 'supervisor') roleBadge = '<span class="role-badge role-supervisor">👩‍🏫 Supervisor</span>';
            else roleBadge = '<span class="role-badge role-nurse">👩‍⚕️ Nurse</span>';
            
            let privilegeText = n.privilege === 1 ? '⭐ Level 1 (Trainee)' : (n.privilege === 2 ? '⭐⭐ Level 2 (Independent)' : '⭐⭐⭐ Level 3 (Preceptor)');
            let statusBadge = n.trainingStatus === 'Completed' ? '<span class="status-completed">✓ Completed</span>' : (n.trainingStatus === 'In Progress' ? '<span class="status-inprogress">🔄 In Progress</span>' : '<span class="status-pending">⏳ Pending</span>');
            
            html += `<tr>
                <td>${n.empId}</td>
                <td><strong>${n.name}</strong></td>
                <td>${n.department}</td>
                <td>${roleBadge}</td>
                <td>${privilegeText}</td>
                <td>${statusBadge}</td>
                <td><button class="promote-btn" onclick="openRoleModal(${n.id})">Change Role</button></td>
            </tr>`;
        });
        
        html += `</tbody></table><p style="margin-top:0.8rem;">Total: ${filtered.length} staff members</p></div>`;
        document.getElementById('mainContent').innerHTML = html;
        closeSidebar();
    }

    let selectedNurseForRoleChange = null;

    function openRoleModal(nurseId) {
        const nurse = nursesData.find(n => n.id === nurseId);
        if (nurse) {
            selectedNurseForRoleChange = nurse;
            document.getElementById('roleModalTitle').innerText = `Change Role: ${nurse.name}`;
            document.getElementById('roleModalNurse').innerHTML = `Current role: <strong>${nurse.role.toUpperCase()}</strong>`;
            document.getElementById('newRoleSelect').value = nurse.role;
            document.getElementById('roleModal').style.display = 'flex';
        }
    }

    function closeRoleModal() { 
        document.getElementById('roleModal').style.display = 'none'; 
        selectedNurseForRoleChange = null; 
    }

    function confirmRoleChange() {
        if (!selectedNurseForRoleChange) return;
        const newRole = document.getElementById('newRoleSelect').value;
        const oldRole = selectedNurseForRoleChange.role;
        if (oldRole === newRole) { alert("No change selected."); closeRoleModal(); return; }
        if (confirm(`Change ${selectedNurseForRoleChange.name} from ${oldRole.toUpperCase()} to ${newRole.toUpperCase()}?`)) {
            selectedNurseForRoleChange.role = newRole;
            if (newRole === 'manager') selectedNurseForRoleChange.privilege = 3;
            else if (newRole === 'supervisor') selectedNurseForRoleChange.privilege = Math.max(2, selectedNurseForRoleChange.privilege);
            updateLoginUsers();
            addAuditLog("ROLE_CHANGE", `${selectedNurseForRoleChange.name} changed from ${oldRole} to ${newRole}`);
            alert(`✅ ${selectedNurseForRoleChange.name} is now a ${newRole.toUpperCase()}!`);
            if (currentUser.id === selectedNurseForRoleChange.empId) {
                currentUser.role = newRole;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateSidebarPrivilege();
                const menu = getMenuForUser(currentUser);
                document.getElementById('navMenu').innerHTML = menu.map(i => `<div class="nav-item" onclick="navigateTo('${i.id}')"><span class="nav-icon">${i.icon}</span> ${i.name}</div>`).join('');
            }
            closeRoleModal();
            renderRoleManagement();
        }
    }

    function renderAuditLog() { 
        let html = `<div class="page-header"><h1 class="page-title">📜 Audit Log</h1><p class="page-desc">Complete history of all user actions and competency changes</p></div>
        <div class="filter-bar"><input type="text" id="auditSearch" placeholder="🔍 Search by user or action" onkeyup="renderAuditLog()"></div>
        <div class="tracker-card">`;
        const search = document.getElementById('auditSearch')?.value.toLowerCase() || '';
        auditLog.filter(l => l.user.toLowerCase().includes(search) || l.action.toLowerCase().includes(search) || l.details.toLowerCase().includes(search)).slice(0, 100).forEach(l => { 
            html += `<div class="audit-log-entry">${new Date(l.timestamp).toLocaleString()} | <strong>${l.user}</strong> (${l.role}) | ${l.action} | ${l.details}</div>`; 
        });
        html += `</div>`;
        document.getElementById('mainContent').innerHTML = html;
        closeSidebar();
    }

    function renderSettings() { 
        document.getElementById('mainContent').innerHTML = `<div class="card"><h3>⚙️ System Settings</h3>
        <div class="setting-group"><label>Upgrade Score (%): </label><input type="number" id="us" value="${systemConfig.privilegeUpgradeScore}"><button onclick="updateSetting('privilegeUpgradeScore',document.getElementById('us').value)">Save</button></div>
        <div class="setting-group"><label>Downgrade Score (%): </label><input type="number" id="ds" value="${systemConfig.privilegeDowngradeScore}"><button onclick="updateSetting('privilegeDowngradeScore',document.getElementById('ds').value)">Save</button></div>
        <div class="setting-group"><label>Inactivity Days: </label><input type="number" id="id" value="${systemConfig.inactivityDaysThreshold}"><button onclick="updateSetting('inactivityDaysThreshold',document.getElementById('id').value)">Save</button></div>
        <div class="setting-group"><label>Quiz Questions: </label><input type="number" id="qq" value="${systemConfig.quizQuestionsCount}"><button onclick="updateSetting('quizQuestionsCount',document.getElementById('qq').value)">Save</button></div>
        <button class="save-btn" onclick="runPrivilegeRecalculation()">🔄 Recalculate All Competencies</button>
        <button class="export-btn" onclick="exportToCSV()">📎 Export Competency Data</button></div>`;
        closeSidebar();
    }

    function updateSetting(key, value) { 
        systemConfig[key] = parseInt(value); 
        localStorage.setItem('smartcare_config', JSON.stringify(systemConfig)); 
        addAuditLog("CONFIG_CHANGE", `${key} → ${value}`); 
        alert(`✅ ${key} updated to ${value}`); 
        renderSettings(); 
    }

    // ========== MENU ==========
    const allMenuItems = [
        { id: "dashboard", name: "Dashboard", icon: "📊", roles: ["admin","manager","supervisor","nurse"] },
        { id: "tracker", name: "Nurse Tracker", icon: "📋", roles: ["admin","manager","supervisor"] },
        { id: "trainingStatus", name: "Training Status", icon: "🎓", roles: ["admin","manager","supervisor"] },
        { id: "quiz", name: "Competency Quiz", icon: "📝", roles: ["nurse"] },
        { id: "reports", name: "Reports", icon: "📑", roles: ["admin","manager","supervisor"] },
        { id: "roleManagement", name: "Role Management", icon: "👔", roles: ["admin","manager"] },
        { id: "auditLog", name: "Audit Log", icon: "📜", roles: ["admin","manager"] },
        { id: "settings", name: "Settings", icon: "⚙️", roles: ["admin"] }
    ];

    function getMenuForUser(user) {
        if(user.role === "admin") return allMenuItems;
        if(user.role === "manager") return allMenuItems.filter(i => i.roles.includes("manager"));
        if(user.role === "supervisor") return allMenuItems.filter(i => i.roles.includes("supervisor"));
        if(user.role === "nurse") return allMenuItems.filter(i => i.roles.includes("nurse"));
        return [];
    }

    function updateSidebarPrivilege() {
        let cls = '', txt = '';
        if(currentUser.role === 'admin') { cls = 'privilege-admin'; txt = '👑 ADMIN'; }
        else if(currentUser.role === 'manager') { cls = 'privilege-manager'; txt = '👔 NURSE MANAGER'; }
        else if(currentUser.role === 'supervisor') { cls = 'privilege-supervisor'; txt = '👩‍🏫 SUPERVISOR'; }
        else { 
            const nurse = nursesData.find(n => n.empId === currentUser.id);
            const priv = nurse ? nurse.privilege : currentUser.privilege;
            txt = priv === 1 ? '⭐ Level 1 (Trainee)' : (priv === 2 ? '⭐⭐ Level 2 (Independent)' : '⭐⭐⭐ Level 3 (Preceptor)');
            cls = priv === 1 ? 'privilege-l1' : (priv === 2 ? 'privilege-l2' : 'privilege-l3');
            currentUser.privilege = priv;
        }
        document.getElementById('userInfo').innerHTML = `<div class="user-name">👤 ${currentUser.name}</div><div class="user-role">${currentUser.role.toUpperCase()} • ${currentUser.department}</div><div class="privilege-indicator ${cls}">${txt}</div>`;
    }

    function initDashboard() {
        updateAllPrivileges();
        updateSidebarPrivilege();
        const menu = getMenuForUser(currentUser);
        document.getElementById('navMenu').innerHTML = menu.map(i => `<div class="nav-item" onclick="navigateTo('${i.id}')"><span class="nav-icon">${i.icon}</span> ${i.name}</div>`).join('');
        navigateTo('dashboard');
    }

    function navigateTo(moduleId) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(event?.target) event.target.closest('.nav-item')?.classList.add('active');
        if(moduleId === 'dashboard') renderDashboard();
        else if(moduleId === 'tracker') renderTrackerSheet();
        else if(moduleId === 'trainingStatus') renderTrainingStatusUpdater();
        else if(moduleId === 'quiz') renderQuiz();
        else if(moduleId === 'reports') renderReports();
        else if(moduleId === 'roleManagement') renderRoleManagement();
        else if(moduleId === 'auditLog') renderAuditLog();
        else if(moduleId === 'settings') renderSettings();
        closeSidebar();
    }

    function logout() { addAuditLog("LOGOUT","User logged out"); localStorage.removeItem('currentUser'); window.location.href = 'index.html'; }

    // Global functions
    window.toggleSidebar = toggleSidebar;
    window.navigateTo = navigateTo;
    window.logout = logout;
    window.renderTrainingStatusUpdater = renderTrainingStatusUpdater;
    window.toggleTrainingCard = toggleTrainingCard;
    window.toggleCategory = toggleCategory;
    window.toggleModuleCompletion = toggleModuleCompletion;
    window.markAllModules = markAllModules;
    window.runPrivilegeRecalculation = runPrivilegeRecalculation;
    window.renderRoleManagement = renderRoleManagement;
    window.openRoleModal = openRoleModal;
    window.closeRoleModal = closeRoleModal;
    window.confirmRoleChange = confirmRoleChange;
    window.updateSetting = updateSetting;
    window.exportToCSV = exportToCSV;
    window.exportToPDFReport = exportToPDFReport;
    window.renderQuiz = renderQuiz;
    window.resetQuiz = resetQuiz;

    initDashboard();
</script>
</body>
</html>
