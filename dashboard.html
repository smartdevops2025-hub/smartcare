<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SMARTCARE — Nurse Induction Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f0f4f8;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0b3b4f 0%, #0f4a5e 100%);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 12px rgba(0,0,0,0.08);
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 101;
            background: #0b3b4f;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.5rem 0.8rem;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .sidebar-header {
            padding: 1.5rem 1.2rem;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .sidebar-header h2 { font-size: 1.5rem; font-weight: 700; }
        .sidebar-header p { font-size: 0.65rem; opacity: 0.7; margin-top: 0.3rem; }

        .user-info {
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.08);
            margin: 0.8rem;
            border-radius: 0.8rem;
        }

        .user-name { font-weight: 600; font-size: 0.85rem; }
        .user-role { font-size: 0.65rem; opacity: 0.7; margin-top: 0.2rem; }

        .privilege-indicator {
            margin-top: 0.6rem;
            padding: 0.4rem;
            border-radius: 0.6rem;
            text-align: center;
            font-size: 0.65rem;
            font-weight: 600;
        }
        .privilege-l1 { background: #3b82f6; color: white; }
        .privilege-l2 { background: #10b981; color: white; }
        .privilege-l3 { background: #8b5cf6; color: white; }
        .privilege-admin { background: #ef4444; color: white; }
        .privilege-manager { background: #8b5cf6; color: white; }
        .privilege-supervisor { background: #f59e0b; color: white; }

        .nav-menu {
            flex: 1;
            padding: 0.5rem 0;
        }

        .nav-item {
            padding: 0.6rem 1rem;
            margin: 0.1rem 0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            color: #e0f2fe;
        }

        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active {
            background: rgba(255,255,255,0.2);
            border-left: 3px solid #7ab7c7;
            font-weight: 500;
        }

        .nav-icon { font-size: 1.1rem; width: 24px; }

        .logout-btn {
            margin: 0.8rem;
            padding: 0.6rem;
            background: rgba(220,80,80,0.2);
            border: 1px solid rgba(220,80,80,0.4);
            border-radius: 0.6rem;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .logout-btn:hover { background: rgba(220,80,80,0.4); }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            transition: margin-left 0.3s ease;
        }

        .page-header { margin-bottom: 1.5rem; }
        .page-title { font-size: 1.5rem; font-weight: 600; color: #0c4e6e; }
        .page-desc { color: #4b5563; font-size: 0.8rem; margin-top: 0.2rem; }

        .dashboard-widgets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .widget {
            background: white;
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .widget:hover { transform: translateY(-2px); }
        .widget-title { font-size: 0.7rem; color: #6b7280; text-transform: uppercase; }
        .widget-value { font-size: 1.8rem; font-weight: 700; color: #0c4e6e; margin: 0.3rem 0; }
        .widget-icon { float: right; font-size: 2rem; opacity: 0.3; }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
        }
        .welcome-icon { font-size: 4rem; margin-bottom: 1rem; }
        .welcome-title { font-size: 1.6rem; font-weight: 600; color: #0c4e6e; }
        .instruction-card {
            background: #e0f2fe;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            color: #0c4e6e;
        }

        .card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .tracker-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow-x: auto;
            padding: 1rem;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { text-align: left; padding: 0.6rem 0.3rem; background: #f8fafc; font-weight: 600; border-bottom: 2px solid #e2e8f0; }
        td { padding: 0.6rem 0.3rem; border-bottom: 1px solid #eef2f6; }

        .status-completed { background: #dcfce7; color: #15803d; padding: 0.2rem 0.5rem; border-radius: 20px; font-size: 0.65rem; display: inline-block; }
        .status-pending { background: #fff3e3; color: #b45309; padding: 0.2rem 0.5rem; border-radius: 20px; font-size: 0.65rem; display: inline-block; }
        .status-inprogress { background: #fef9c3; color: #854d0e; padding: 0.2rem 0.5rem; border-radius: 20px; font-size: 0.65rem; display: inline-block; }

        .filter-bar {
            margin-bottom: 1rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar input, .filter-bar select { padding: 0.4rem 0.8rem; border: 1px solid #cbd5e1; border-radius: 2rem; font-size: 0.75rem; }

        .btn-small, .quiz-btn, .update-btn, .add-btn, .edit-btn, .delete-btn, .save-btn, .export-btn, .import-btn {
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 1.5rem;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .btn-small { background: #0f5b63; }
        .quiz-btn { background: #0f5b63; }
        .update-btn { background: #f59e0b; }
        .add-btn { background: #10b981; }
        .edit-btn { background: #3b82f6; }
        .delete-btn { background: #ef4444; }
        .save-btn { background: #8b5cf6; }
        .export-btn { background: #6b7280; }
        .import-btn { background: #8b5cf6; }

        .quiz-question {
            background: #f8fafc;
            padding: 0.8rem;
            margin-bottom: 0.8rem;
            border-radius: 0.6rem;
        }
        .quiz-question p { font-weight: 600; margin-bottom: 0.4rem; font-size: 0.85rem; }
        .quiz-option { margin: 0.2rem 0 0.2rem 0.8rem; display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; }
        .score-display {
            font-size: 1rem;
            font-weight: 700;
            padding: 0.8rem;
            background: #e0f2fe;
            border-radius: 0.8rem;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1rem;
        }
        .stat-card {
            background: white;
            padding: 1rem;
            border-radius: 0.8rem;
            text-align: center;
        }
        .stat-number { font-size: 1.8rem; font-weight: 700; color: #0c4e6e; }
        .stat-label { font-size: 0.7rem; color: #6b7280; }

        .chart-container { max-width: 300px; margin: 0 auto; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 500px;
        }
        .modal-content h3 { margin-bottom: 0.8rem; color: #0c4e6e; font-size: 1.2rem; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.6rem;
        }
        .modal-buttons { display: flex; gap: 0.8rem; justify-content: flex-end; }

        .audit-log-entry {
            padding: 0.4rem;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.75rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100%;
                width: 260px;
                transition: left 0.3s ease;
                z-index: 200;
            }
            .sidebar.open { left: 0; }
            .sidebar-toggle { display: block; }
            .main-content { padding: 0.8rem; margin-top: 3rem; }
            .dashboard-widgets { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
            .widget-value { font-size: 1.3rem; }
            .page-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<button class="sidebar-toggle" onclick="toggleSidebar()">☰ Menu</button>
<div class="app-container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>SMARTCARE</h2>
            <p>Induction & privileging</p>
        </div>
        <div class="user-info" id="userInfo"></div>
        <div class="nav-menu" id="navMenu"></div>
        <div class="logout-btn" onclick="logout()">← Logout</div>
    </div>
    <div class="main-content" id="mainContent">
        <div class="welcome-screen">
            <div class="welcome-icon">🫀⚕️</div>
            <div class="welcome-title">Welcome to SMARTCARE</div>
            <div class="instruction-card">💡 Select an option from the menu</div>
        </div>
    </div>
</div>

<script>
    // ========== MOBILE SIDEBAR ==========
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }
    function closeSidebar() {
        if (window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.remove('open');
        }
    }

    // ========== AUDIT LOG ==========
    let auditLog = [];
    function addAuditLog(action, details) {
        auditLog.unshift({ timestamp: new Date().toISOString(), user: currentUser?.name, userId: currentUser?.id, role: currentUser?.role, action, details });
        if(auditLog.length > 1000) auditLog.pop();
        localStorage.setItem('smartcare_audit', JSON.stringify(auditLog));
    }
    const savedAudit = localStorage.getItem('smartcare_audit');
    if(savedAudit) auditLog = JSON.parse(savedAudit);

    // ========== USER SESSION ==========
    let currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) window.location.href = 'index.html';
    addAuditLog("LOGIN", "User logged in");

    // ========== SYSTEM CONFIG ==========
    let systemConfig = { passingScore: 70, privilegeUpgradeScore: 85, autoAssignPrivilege: true };
    const savedConfig = localStorage.getItem('smartcare_config');
    if(savedConfig) Object.assign(systemConfig, JSON.parse(savedConfig));

    // ========== TRAINING MODULES FROM EXCEL ==========
    // Based on the Excel file structure: ICU, OT, Infection Control sheets
    const trainingModulesByDept = {
        "ICU": [
            "ICU Basic Life Support (BLS)",
            "ICU Advanced Cardiac Life Support (ACLS)",
            "ICU Ventilator Management",
            "ICU Hemodynamic Monitoring",
            "ICU Central Line Care",
            "ICU Sedation and Analgesia Protocols",
            "ICU Infection Control Bundle",
            "ICU Rapid Response Team Activation",
            "ICU End of Life Care",
            "ICU Handoff Communication (SBAR)"
        ],
        "OT": [
            "OT Surgical Scrub Techniques",
            "OT Sterile Field Setup",
            "OT Surgical Safety Checklist",
            "OT Instrument Sterilization",
            "OT Counts (Sponge, Needle, Instrument)",
            "OT Waste Management",
            "OT Anesthesia Equipment Handling",
            "OT Emergency Protocols (Fire, Cardiac Arrest)",
            "OT Pre-op Patient Verification",
            "OT Post-op Instrument Care"
        ],
        "Infection Control": [
            "Hand Hygiene Compliance (WHO 5 Moments)",
            "Personal Protective Equipment (PPE) Use",
            "Isolation Precautions (Contact, Droplet, Airborne)",
            "Medical Waste Segregation & Disposal",
            "Needlestick Injury Prevention & Management",
            "Environmental Cleaning & Disinfection",
            "Surveillance of Healthcare-Associated Infections (HAIs)",
            "Antibiotic Stewardship Basics",
            "Outbreak Management",
            "Sterilization & High-Level Disinfection"
        ]
    };

    // ========== NURSES DATA ==========
    let nursesData = [
        { id: 1, name: "Sarah Johnson", empId: "NURSE101", department: "ICU", preEval: null, postEval: null, trainingStatus: "Pending", privilege: 1, joiningDate: "2025-01-15", password: "nurse123", role: "nurse", trainingModulesCompleted: [] },
        { id: 2, name: "Michael Chen", empId: "NURSE102", department: "OT", preEval: 88, postEval: 91, trainingStatus: "Completed", privilege: 2, joiningDate: "2024-11-20", password: "nurse123", role: "nurse", trainingModulesCompleted: trainingModulesByDept.OT.slice(0, 8) },
        { id: 3, name: "Emma Davis", empId: "NURSE103", department: "Infection Control", preEval: 94, postEval: 96, trainingStatus: "Completed", privilege: 3, joiningDate: "2024-08-10", password: "nurse123", role: "nurse", trainingModulesCompleted: trainingModulesByDept["Infection Control"] },
        { id: 4, name: "Priya Sharma", empId: "NURSE104", department: "ICU", preEval: null, postEval: null, trainingStatus: "Pending", privilege: 1, joiningDate: "2025-02-01", password: "nurse123", role: "nurse", trainingModulesCompleted: [] },
        { id: 5, name: "James Wilson", empId: "SUP001", department: "ICU", preEval: 95, postEval: 98, trainingStatus: "Completed", privilege: 2, joiningDate: "2024-06-15", password: "super123", role: "supervisor", trainingModulesCompleted: trainingModulesByDept.ICU },
        { id: 6, name: "Mary Thompson", empId: "MGR001", department: "ICU", preEval: 98, postEval: 99, trainingStatus: "Completed", privilege: 3, joiningDate: "2024-01-10", password: "manager123", role: "manager", trainingModulesCompleted: trainingModulesByDept.ICU }
    ];

    function updateLoginUsers() {
        let loginUsers = { "ADMIN999": { password: "Admin@2025", role: "admin", name: "System Admin", privilege: 3, department: "All" } };
        nursesData.forEach(n => { loginUsers[n.empId] = { password: n.password, role: n.role, name: n.name, privilege: n.privilege, department: n.department }; });
        localStorage.setItem('smartcare_users', JSON.stringify(loginUsers));
    }

    // ========== QUIZZES ==========
    const quizzes = {
        "ICU": { title: "ICU Pre-evaluation", questions: [
            { text: "What is the normal range for adult heart rate?", options: ["40-60 bpm", "60-100 bpm", "100-140 bpm", "20-40 bpm"], correct: 1 },
            { text: "Which of the following indicates sepsis?", options: ["Temp >38°C or <36°C", "Heart rate <60", "BP >140/90", "RR <12"], correct: 0 },
            { text: "First-line vasopressor in septic shock?", options: ["Dopamine", "Epinephrine", "Norepinephrine", "Phenylephrine"], correct: 2 },
            { text: "Normal PaO2 range on ABG?", options: ["35-45 mmHg", "50-60 mmHg", "75-100 mmHg", "100-120 mmHg"], correct: 2 },
            { text: "Common ICU sedation score?", options: ["GCS", "RASS", "APACHE", "SOFA"], correct: 1 }
        ]},
        "OT": { title: "OT Pre-evaluation", questions: [
            { text: "Standard surgical hand scrub time?", options: ["1 min", "2-5 min", "10 min", "15 min"], correct: 1 },
            { text: "Sterile field violation?", options: ["Turning back", "Speaking", "Wearing mask", "Sterile gloves"], correct: 0 },
            { text: "Correct PPE donning order?", options: ["Gown,mask,gloves,goggles", "Gown,mask,goggles,gloves", "Gloves,gown,mask,goggles", "Mask,goggles,gown,gloves"], correct: 1 },
            { text: "Highest SSI risk surgery?", options: ["Laparoscopic", "Clean", "Clean-contaminated", "Dirty/infected"], correct: 3 },
            { text: "Ideal OT temperature?", options: ["16-18°C", "18-22°C", "22-25°C", "25-28°C"], correct: 1 }
        ]},
        "Infection Control": { title: "Infection Control Pre-evaluation", questions: [
            { text: "Most effective HAI prevention?", options: ["Isolation", "Hand hygiene", "Antibiotics", "PPE"], correct: 1 },
            { text: "Hand hygiene duration?", options: ["5 sec", "10-15 sec", "20-30 sec", "60 sec"], correct: 2 },
            { text: "TB precaution type?", options: ["Contact", "Droplet", "Airborne", "Standard"], correct: 2 },
            { text: "Infectious waste bag color?", options: ["Black", "Yellow", "Blue", "Red"], correct: 1 },
            { text: "Needlestick first aid?", options: ["Wash with soap", "Squeeze", "Tourniquet", "Ignore"], correct: 0 }
        ]}
    };

    // ========== MENU ==========
    const allMenuItems = [
        { id: "dashboard", name: "📊 Dashboard", icon: "📊", roles: ["admin","manager","supervisor","nurse"] },
        { id: "tracker", name: "📋 Nurse Tracker", icon: "📋", roles: ["admin","manager","supervisor","nurse_privilege_3"] },
        { id: "preEval", name: "📝 Pre-evaluation", icon: "✍️", roles: ["admin","manager","nurse","supervisor"] },
        { id: "trainingStatus", name: "✅ Training Status", icon: "🎓", roles: ["admin","manager","supervisor"] },
        { id: "postEval", name: "📈 Post-evaluation", icon: "📈", roles: ["admin","manager","nurse_privilege_2","nurse_privilege_3","supervisor"] },
        { id: "reports", name: "📑 Reports", icon: "📄", roles: ["admin","manager","supervisor","nurse_privilege_3"] },
        { id: "auditLog", name: "📜 Audit Log", icon: "📋", roles: ["admin","manager"] },
        { id: "userManagement", name: "👥 User Management", icon: "👥", roles: ["admin","manager"] },
        { id: "settings", name: "🔧 Settings", icon: "⚙️", roles: ["admin"] }
    ];

    function getMenuForUser(user) {
        if(user.role === "admin") return allMenuItems;
        if(user.role === "manager") return allMenuItems.filter(i => i.roles.includes("manager") || i.roles.includes("admin"));
        if(user.role === "supervisor") return allMenuItems.filter(i => i.roles.includes("supervisor"));
        if(user.role === "nurse") {
            if(user.privilege >= 3) return allMenuItems.filter(i => i.roles.includes("nurse_privilege_3") || i.roles.includes("nurse"));
            if(user.privilege >= 2) return allMenuItems.filter(i => i.roles.includes("nurse_privilege_2") || i.roles.includes("nurse"));
            return allMenuItems.filter(i => i.roles.includes("nurse") && !i.roles.includes("nurse_privilege_2") && !i.roles.includes("nurse_privilege_3"));
        }
        return [];
    }

    // ========== TRAINING STATUS UPDATER ==========
    function renderTrainingStatusUpdater() {
        let html = `<div class="page-header"><h1 class="page-title">✅ Training Status Updater</h1><p class="page-desc">Mark individual training modules as complete for each nurse</p></div><div class="filter-bar"><input type="text" id="searchTrain" placeholder="🔍 Search nurse" onkeyup="renderTrainingStatusUpdater()"><select id="filterDeptTrain" onchange="renderTrainingStatusUpdater()"><option value="all">All Depts</option><option value="ICU">ICU</option><option value="OT">OT</option><option value="Infection Control">Infection Control</option></select></div>`;
        
        const filterDept = document.getElementById('filterDeptTrain')?.value || 'all';
        const searchTerm = document.getElementById('searchTrain')?.value.toLowerCase() || '';
        let filtered = nursesData.filter(n => (filterDept === 'all' || n.department === filterDept) && (n.name.toLowerCase().includes(searchTerm) || n.empId.toLowerCase().includes(searchTerm)));
        
        filtered.forEach(nurse => {
            const modules = trainingModulesByDept[nurse.department] || trainingModulesByDept.ICU;
            let modulesHtml = `<div style="margin-bottom:1rem; border:1px solid #e2e8f0; border-radius:0.8rem; padding:0.8rem;">`;
            modulesHtml += `<h4 style="margin-bottom:0.5rem;">👩‍⚕️ ${nurse.name} (${nurse.empId}) - ${nurse.department}</h4>`;
            modulesHtml += `<div style="display:flex; flex-wrap:wrap; gap:0.5rem;">`;
            modules.forEach(module => {
                const isCompleted = nurse.trainingModulesCompleted?.includes(module);
                modulesHtml += `<button class="${isCompleted ? 'status-completed' : 'update-btn'}" style="padding:0.3rem 0.8rem; font-size:0.7rem;" onclick="toggleModuleCompletion('${nurse.empId}', '${module.replace(/'/g, "\\'")}')">
                    ${isCompleted ? '✅' : '⬜'} ${module.substring(0, 30)}
                </button>`;
            });
            modulesHtml += `</div><div style="margin-top:0.5rem; font-size:0.7rem;">Completed: ${nurse.trainingModulesCompleted?.length || 0}/${modules.length}</div></div>`;
            html += modulesHtml;
        });
        
        html += `<div class="card"><button class="save-btn" onclick="updateOverallTrainingStatus()">Update Overall Training Status</button></div>`;
        document.getElementById('mainContent').innerHTML = html;
        closeSidebar();
    }

    function toggleModuleCompletion(empId, moduleName) {
        const nurse = nursesData.find(n => n.empId === empId);
        if(nurse) {
            if(!nurse.trainingModulesCompleted) nurse.trainingModulesCompleted = [];
            const index = nurse.trainingModulesCompleted.indexOf(moduleName);
            if(index === -1) {
                nurse.trainingModulesCompleted.push(moduleName);
                addAuditLog("MODULE_COMPLETED", `${nurse.name} completed module: ${moduleName}`);
            } else {
                nurse.trainingModulesCompleted.splice(index, 1);
                addAuditLog("MODULE_UNCOMPLETED", `${nurse.name} unmarked module: ${moduleName}`);
            }
            renderTrainingStatusUpdater();
        }
    }

    function updateOverallTrainingStatus() {
        nursesData.forEach(nurse => {
            const modules = trainingModulesByDept[nurse.department] || trainingModulesByDept.ICU;
            const completedCount = nurse.trainingModulesCompleted?.length || 0;
            const totalCount = modules.length;
            if(completedCount === totalCount) {
                nurse.trainingStatus = "Completed";
            } else if(completedCount > 0) {
                nurse.trainingStatus = "In Progress";
            } else {
                nurse.trainingStatus = "Pending";
            }
        });
        updateLoginUsers();
        addAuditLog("TRAINING_BULK_UPDATE", "Overall training status updated for all nurses");
        alert("✅ Training status updated for all nurses based on module completion!");
        renderTrainingStatusUpdater();
    }

    // ========== PRE-EVALUATION ==========
    function renderPreEvaluation() {
        const quiz = quizzes[currentUser.department];
        if (!quiz) { document.getElementById('mainContent').innerHTML = `<div class="card"><p>No pre-evaluation for your department.</p></div>`; return; }
        let html = `<div class="page-header"><h1 class="page-title">📝 ${quiz.title}</h1><p class="page-desc">Passing score: ${systemConfig.passingScore}%</p></div><div class="card"><form id="preEvalForm">`;
        quiz.questions.forEach((q, idx) => {
            html += `<div class="quiz-question"><p>${idx+1}. ${q.text}</p>`;
            q.options.forEach((opt, optIdx) => { html += `<label class="quiz-option"><input type="radio" name="q${idx}" value="${optIdx}" required> ${opt}</label>`; });
            html += `</div>`;
        });
        html += `<button type="submit" class="quiz-btn">Submit Pre-evaluation</button></form></div>`;
        document.getElementById('mainContent').innerHTML = html;
        document.getElementById('preEvalForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let score = 0;
            quiz.questions.forEach((q, idx) => {
                const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                if(selected && parseInt(selected.value) === q.correct) score++;
            });
            const percentage = Math.round((score / quiz.questions.length) * 100);
            const passed = percentage >= systemConfig.passingScore;
            alert(`Score: ${percentage}% - ${passed ? 'PASSED ✓' : 'FAILED ✗'}`);
            const nurse = nursesData.find(n => n.empId === currentUser.id);
            if(nurse) {
                nurse.preEval = percentage;
                if(passed && nurse.trainingStatus === 'Pending') nurse.trainingStatus = "In Progress";
                addAuditLog("PRE_EVAL", `${currentUser.name} scored ${percentage}%`);
            }
            document.getElementById('mainContent').innerHTML = `<div class="card"><div class="score-display">✅ Pre-evaluation: ${percentage}%</div><button class="quiz-btn" onclick="navigateTo('dashboard','Dashboard')">Go to Dashboard</button></div>`;
        });
        closeSidebar();
    }

    // ========== POST-EVALUATION ==========
    function renderPostEvaluation() {
        const quiz = quizzes[currentUser.department];
        if (!quiz) { document.getElementById('mainContent').innerHTML = `<div class="card"><p>No post-evaluation.</p></div>`; return; }
        const nurse = nursesData.find(n => n.empId === currentUser.id);
        if(!nurse?.preEval) { document.getElementById('mainContent').innerHTML = `<div class="card"><p>⚠️ Complete Pre-evaluation first.</p><button class="quiz-btn" onclick="navigateTo('preEval','Pre-evaluation')">Go to Pre-evaluation</button></div>`; return; }
        let html = `<div class="page-header"><h1 class="page-title">📈 Post-evaluation - ${quiz.title}</h1><p class="page-desc">Upgrade score: ${systemConfig.privilegeUpgradeScore}%</p></div><div class="card"><form id="postEvalForm">`;
        quiz.questions.forEach((q, idx) => {
            html += `<div class="quiz-question"><p>${idx+1}. ${q.text}</p>`;
            q.options.forEach((opt, optIdx) => { html += `<label class="quiz-option"><input type="radio" name="q${idx}" value="${optIdx}" required> ${opt}</label>`; });
            html += `</div>`;
        });
        html += `<button type="submit" class="quiz-btn">Submit Post-evaluation</button></form></div>`;
        document.getElementById('mainContent').innerHTML = html;
        document.getElementById('postEvalForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let score = 0;
            quiz.questions.forEach((q, idx) => {
                const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                if(selected && parseInt(selected.value) === q.correct) score++;
            });
            const percentage = Math.round((score / quiz.questions.length) * 100);
            if(nurse) {
                nurse.postEval = percentage;
                if(systemConfig.autoAssignPrivilege && percentage >= systemConfig.privilegeUpgradeScore && nurse.privilege < 3) {
                    nurse.privilege++;
                    addAuditLog("PRIVILEGE_UPGRADE", `${currentUser.name} upgraded to Level ${nurse.privilege}`);
                    alert(`🎉 Privilege upgraded to Level ${nurse.privilege}!`);
                    updateSidebarPrivilege();
                }
                nurse.trainingStatus = "Completed";
                addAuditLog("POST_EVAL", `${currentUser.name} scored ${percentage}%`);
                alert(`Post-evaluation: ${percentage}%`);
            }
            document.getElementById('mainContent').innerHTML = `<div class="card"><div class="score-display">✅ Post-evaluation: ${percentage}%</div><button class="quiz-btn" onclick="navigateTo('dashboard','Dashboard')">Go to Dashboard</button></div>`;
        });
        closeSidebar();
    }

    // ========== DASHBOARD ==========
    function renderDashboard() {
        const total = nursesData.length;
        const completed = nursesData.filter(n => n.trainingStatus === 'Completed').length;
        const inProgress = nursesData.filter(n => n.trainingStatus === 'In Progress').length;
        const pending = nursesData.filter(n => n.trainingStatus === 'Pending').length;
        const avgPre = nursesData.filter(n => n.preEval).reduce((s,n)=>s+n.preEval,0)/(nursesData.filter(n=>n.preEval).length||1);
        const avgPost = nursesData.filter(n => n.postEval).reduce((s,n)=>s+n.postEval,0)/(nursesData.filter(n=>n.postEval).length||1);
        
        let deptStats = {};
        nursesData.forEach(n => {
            if(!deptStats[n.department]) deptStats[n.department] = { total:0, completed:0 };
            deptStats[n.department].total++;
            if(n.trainingStatus === 'Completed') deptStats[n.department].completed++;
        });
        
        let html = `<div class="page-header"><h1 class="page-title">📊 Dashboard</h1></div>
        <div class="dashboard-widgets">
            <div class="widget"><div class="widget-icon">👩‍⚕️</div><div class="widget-title">Total Nurses</div><div class="widget-value">${total}</div></div>
            <div class="widget"><div class="widget-icon">✅</div><div class="widget-title">Completed</div><div class="widget-value">${completed}</div></div>
            <div class="widget"><div class="widget-icon">🔄</div><div class="widget-title">In Progress</div><div class="widget-value">${inProgress}</div></div>
            <div class="widget"><div class="widget-icon">⏳</div><div class="widget-title">Pending</div><div class="widget-value">${pending}</div></div>
            <div class="widget"><div class="widget-icon">📝</div><div class="widget-title">Avg Pre-eval</div><div class="widget-value">${Math.round(avgPre)}%</div></div>
            <div class="widget"><div class="widget-icon">📈</div><div class="widget-title">Avg Post-eval</div><div class="widget-value">${Math.round(avgPost)}%</div></div>
        </div>
        <div class="stats-grid">${Object.entries(deptStats).map(([dept,data])=>`<div class="stat-card"><div class="stat-number">${Math.round(data.completed/data.total*100)}%</div><div class="stat-label">${dept}</div><small>${data.completed}/${data.total}</small></div>`).join('')}</div>
        <div class="card"><canvas id="trainingChart"></canvas></div>`;
        document.getElementById('mainContent').innerHTML = html;
        setTimeout(() => {
            const ctx = document.getElementById('trainingChart')?.getContext('2d');
            if(ctx) new Chart(ctx, { type: 'doughnut', data: { labels: ['Completed','In Progress','Pending'], datasets: [{ data: [completed,inProgress,pending], backgroundColor: ['#10b981','#f59e0b','#ef4444'] }] } });
        }, 100);
        closeSidebar();
    }

    // ========== TRACKER ==========
    function renderTrackerSheet() {
        let html = `<div class="page-header"><h1 class="page-title">📋 Nurse Tracker</h1></div><div class="tracker-card"><div class="filter-bar"><input type="text" id="searchName" placeholder="🔍 Search" onkeyup="renderTrackerSheet()"><select id="filterDept" onchange="renderTrackerSheet()"><option value="all">All</option><option value="ICU">ICU</option><option value="OT">OT</option><option value="Infection Control">Infection Control</option></select></div><table><thead><tr><th>Emp ID</th><th>Name</th><th>Dept</th><th>Pre%</th><th>Post%</th><th>Modules Done</th><th>Status</th><th>Privilege</th></tr></thead><tbody>`;
        const filter = document.getElementById('filterDept')?.value || 'all';
        const search = document.getElementById('searchName')?.value.toLowerCase() || '';
        nursesData.filter(n => (filter==='all'||n.department===filter) && (n.name.toLowerCase().includes(search)||n.empId.toLowerCase().includes(search))).forEach(n => {
            const modulesDone = n.trainingModulesCompleted?.length || 0;
            const totalModules = (trainingModulesByDept[n.department]||trainingModulesByDept.ICU).length;
            html += `<tr><td>${n.empId}</td><td><strong>${n.name}</strong></td><td>${n.department}</td><td>${n.preEval||'—'}%</td><td>${n.postEval||'—'}%</td><td>${modulesDone}/${totalModules}</td><td>${n.trainingStatus}</td><td>${n.privilege===1?'⭐ L1':n.privilege===2?'⭐⭐ L2':'⭐⭐⭐ L3'}</td></tr>`;
        });
        html += `</tbody></table></div>`;
        document.getElementById('mainContent').innerHTML = html;
        closeSidebar();
    }

    function renderReports() { renderDashboard(); }
    function renderAuditLog() { 
        let html = `<div class="page-header"><h1 class="page-title">📜 Audit Log</h1></div><div class="tracker-card">`;
        auditLog.slice(0,50).forEach(log => { html += `<div class="audit-log-entry">${new Date(log.timestamp).toLocaleString()} | ${log.user} | ${log.action} | ${log.details}</div>`; });
        html += `</div>`;
        document.getElementById('mainContent').innerHTML = html;
        closeSidebar();
    }
    function renderUserManagement() { document.getElementById('mainContent').innerHTML = `<div class="card"><p>User Management - Coming Soon</p></div>`; closeSidebar(); }
    function renderSettings() { document.getElementById('mainContent').innerHTML = `<div class="card"><p>Settings - Coming Soon</p></div>`; closeSidebar(); }

    function updateSidebarPrivilege() {
        let cls = '', txt = '';
        if(currentUser.role === 'admin') { cls = 'privilege-admin'; txt = '👑 ADMIN'; }
        else if(currentUser.role === 'manager') { cls = 'privilege-manager'; txt = '👔 NURSE MANAGER'; }
        else if(currentUser.role === 'supervisor') { cls = 'privilege-supervisor'; txt = '👩‍🏫 SUPERVISOR'; }
        else { txt = currentUser.privilege === 1 ? '⭐ Level 1' : (currentUser.privilege === 2 ? '⭐⭐ Level 2' : '⭐⭐⭐ Level 3'); cls = currentUser.privilege === 1 ? 'privilege-l1' : (currentUser.privilege === 2 ? 'privilege-l2' : 'privilege-l3'); }
        document.getElementById('userInfo').innerHTML = `<div class="user-name">👤 ${currentUser.name}</div><div class="user-role">${currentUser.role.toUpperCase()} • ${currentUser.department}</div><div class="privilege-indicator ${cls}">${txt}</div>`;
    }

    function initDashboard() {
        updateSidebarPrivilege();
        const menu = getMenuForUser(currentUser);
        document.getElementById('navMenu').innerHTML = menu.map(i => `<div class="nav-item" onclick="navigateTo('${i.id}')"><span class="nav-icon">${i.icon}</span> ${i.name}</div>`).join('');
        navigateTo('dashboard');
    }

    function navigateTo(moduleId) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(event?.target) event.target.closest('.nav-item')?.classList.add('active');
        if(moduleId === 'dashboard') renderDashboard();
        else if(moduleId === 'tracker') renderTrackerSheet();
        else if(moduleId === 'preEval') renderPreEvaluation();
        else if(moduleId === 'trainingStatus') renderTrainingStatusUpdater();
        else if(moduleId === 'postEval') renderPostEvaluation();
        else if(moduleId === 'reports') renderReports();
        else if(moduleId === 'auditLog') renderAuditLog();
        else if(moduleId === 'userManagement') renderUserManagement();
        else if(moduleId === 'settings') renderSettings();
        closeSidebar();
    }

    function logout() { addAuditLog("LOGOUT","User logged out"); localStorage.removeItem('currentUser'); window.location.href = 'index.html'; }

    window.toggleSidebar = toggleSidebar;
    window.navigateTo = navigateTo;
    window.logout = logout;
    window.renderTrainingStatusUpdater = renderTrainingStatusUpdater;
    window.toggleModuleCompletion = toggleModuleCompletion;
    window.updateOverallTrainingStatus = updateOverallTrainingStatus;
    window.renderTrackerSheet = renderTrackerSheet;
    window.renderPreEvaluation = renderPreEvaluation;
    window.renderPostEvaluation = renderPostEvaluation;
    window.renderDashboard = renderDashboard;

    initDashboard();
</script>
</body>
</html>
